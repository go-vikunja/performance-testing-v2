# Tuned for ccx23 (4 dedicated vCPU, 16 GB). Scale shared_buffers/effective_cache_size with RAM.
listen_addresses = '*'
max_connections = 200
shared_buffers = 4GB
effective_cache_size = 12GB
maintenance_work_mem = 1GB
work_mem = 32MB
wal_buffers = 64MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 0
# sub-ms OLTP statements: JIT and parallel plans only add planning overhead
jit = off
# pgx keeps prepared statements, but auto mode still custom-plans the recursive CTEs on every execution
plan_cache_mode = force_generic_plan

# Instrumentation
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all
pg_stat_statements.track_planning = on
track_io_timing = on
track_activity_query_size = 4096
log_min_duration_statement = 250ms
log_lock_waits = on
log_checkpoints = on
