# Extra collectors beyond the exporter's built-in pg_stat_database / pg_stat_user_tables.
pg_stat_statements_top:
  query: |
    SELECT queryid::text, left(regexp_replace(query, '\s+', ' ', 'g'), 120) AS query,
           calls, total_exec_time, mean_exec_time, rows,
           shared_blks_hit, shared_blks_read, shared_blk_read_time AS blk_read_time, shared_blk_write_time AS blk_write_time
    FROM pg_stat_statements
    WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
    ORDER BY total_exec_time DESC LIMIT 50
  master: true
  metrics:
    - queryid: { usage: LABEL }
    - query: { usage: LABEL }
    - calls: { usage: COUNTER, description: "Executions" }
    - total_exec_time: { usage: COUNTER, description: "Total ms spent" }
    - mean_exec_time: { usage: GAUGE, description: "Mean ms" }
    - rows: { usage: COUNTER }
    - shared_blks_hit: { usage: COUNTER }
    - shared_blks_read: { usage: COUNTER }
    - blk_read_time: { usage: COUNTER }
    - blk_write_time: { usage: COUNTER }

pg_stat_statements_kind:
  query: |
    SELECT CASE WHEN query ~* '^\s*select' THEN 'read'
                WHEN query ~* '^\s*(insert|update|delete)' THEN 'write'
                ELSE 'other' END AS kind,
           sum(calls) AS calls, sum(total_exec_time) AS total_exec_time, sum(rows) AS rows
    FROM pg_stat_statements
    WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
    GROUP BY 1
  master: true
  metrics:
    - kind: { usage: LABEL }
    - calls: { usage: COUNTER, description: "Statements by kind" }
    - total_exec_time: { usage: COUNTER, description: "ms by kind" }
    - rows: { usage: COUNTER }

pg_activity:
  query: |
    SELECT state, wait_event_type, count(*) AS count
    FROM pg_stat_activity WHERE datname = current_database()
    GROUP BY 1, 2
  master: true
  metrics:
    - state: { usage: LABEL }
    - wait_event_type: { usage: LABEL }
    - count: { usage: GAUGE }

pg_locks_waiting:
  query: SELECT count(*) AS count FROM pg_locks WHERE NOT granted
  master: true
  metrics:
    - count: { usage: GAUGE }
