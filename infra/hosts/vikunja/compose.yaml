services:
  vikunja:
    image: ${VIKUNJA_IMAGE}
    restart: unless-stopped
    ports: ["${VIKUNJA_PIP}:3456:3456"]
    environment:
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: ${DB_PIP}
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: ${DB_PASSWORD}
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_MAXOPENCONNECTIONS: 192
      # default is 10000 ms: every connection is recycled after 10 s, taking pgx's statement cache and the plan cache with it
      VIKUNJA_DATABASE_MAXCONNECTIONLIFETIME: 3600000
      VIKUNJA_SERVICE_PUBLICURL: http://${VIKUNJA_PIP}:3456/
      VIKUNJA_SERVICE_SECRET: ${JWT_SECRET}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
      VIKUNJA_METRICS_ENABLED: "true"
      # go-vikunja/vikunja#3785: /debug/pprof on the private IP, for CPU profiles during a run
      VIKUNJA_METRICS_PPROF: "true"
      # all load comes from one IP; pre-auth limiter is per-IP and always on
      VIKUNJA_RATELIMIT_NOAUTHLIMIT: 10000000
      VIKUNJA_RATELIMIT_TOKENREFRESHLIMIT: 10000000
      # the 25 logins/s ramp is a bcrypt benchmark otherwise; production keeps the default 11
      VIKUNJA_SERVICE_BCRYPTROUNDS: 4
      # ~2.3 GCs/s at GOGC 100 under load on a 16 GB box; trade heap for GC CPU
      GOGC: 400
      GOMEMLIMIT: 32GiB
      VIKUNJA_LOG_HTTP: "off"
      VIKUNJA_LOG_LEVEL: WARNING
      VIKUNJA_MAILER_ENABLED: "false"
      # 5xx only, upstream DSN; environment tag keeps perf runs apart from real installs
      VIKUNJA_SENTRY_ENABLED: "true"
      SENTRY_ENVIRONMENT: perf-testing
    user: "1000:1000"
    volumes:
      - ./files:/app/vikunja/files
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      # the subcommand boots a full engine incl. schema introspection; 5 s showed up in pg_stat_statements
      interval: 30s

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes: ["/:/host:ro,rslave"]
    command: ["--path.rootfs=/host", "--web.listen-address=${VIKUNJA_PIP}:9100"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    ports: ["${VIKUNJA_PIP}:8080:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
